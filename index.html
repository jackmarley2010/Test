<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Meine erste Webseite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #34495e;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            padding: 15px 20px;
            text-decoration: none;
        }

        nav a:hover {
            background: #2c3e50;
        }

        section {
            padding: 40px;
            max-width: 900px;
            margin: auto;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background: #2980b9;
        }

        form input, form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>Willkommen auf meiner Webseite</h1>
    <p>HTML • CSS • JavaScript</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#about">Über mich</a>
    <a href="#contact">Kontakt</a>
</nav>

<section id="home">
    <h2>Home</h2>
    <p>Das ist eine komplett funktionierende Webseite mit HTML, CSS und JavaScript.</p>
    <button onclick="zeigeNachricht()">Klick mich</button>
</section>

<section id="about">
    <h2>Über mich</h2>
    <p>Hier kannst du etwas über dich oder dein Projekt schreiben.</p>
</section>

<section id="contact">
    <h2>Kontakt</h2>
    <form onsubmit="senden(event)">
        <input type="text" placeholder="Dein Name" required>
        <input type="email" placeholder="Deine E-Mail" required>
        <textarea placeholder="Nachricht" required></textarea>
        <button type="submit">Absenden</button>
    </form>
</section>

<footer>
    <p>© 2026 Meine Webseite</p>
</footer>

<!-- JavaScript -->
<script>
    function zeigeNachricht() {
        alert("JavaScript funktioniert! 🎉");
    }

    function senden(event) {
        event.preventDefault();
        alert("Formular wurde abgeschickt (Demo).");
    }
</script>

</body>
</html>
